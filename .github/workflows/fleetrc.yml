# GENERATED by fleetrc (fleet/main.ncl)
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: experimental-features = nix-command
    - name: Generated files match fleet/*.ncl
      run: nix-shell -A shell --run './generate --check'
    - name: Lint
      run: nix-shell -A shell --run 'shellcheck generate nix/fleetrc.sh generated/setup/*.sh'
    - name: Yen fleet rules
      run: nix-build -A check
    - name: Yen rule tests
      run: nix-build -A tests
    - name: Build role nix
      run: nix-build -A role.nix
    - name: Build role typst-cloudflare
      run: nix-build -A role.typst-cloudflare
name: fleetrc
on:
  pull_request: {}
  push: {}
